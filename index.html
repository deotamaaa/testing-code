<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One More Reps</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">
    <header>
        <h1>One More Reps</h1>
        <p>Track your gym sessions, calories, and progress</p>
    </header>

    <div class="tabs">
        <button class="tab active" data-tab="gym">Gym Log</button>
        <button class="tab" data-tab="calories">Calories</button>
        <button class="tab" data-tab="progress">Progress</button>
    </div>

    <!-- GYM PANEL -->
    <section class="panel active" id="gym">
        <div class="card">
            <h2>Log a Workout</h2>
            <label for="exName">Exercise</label>
            <input type="text" id="exName" placeholder="e.g., Bench Press">
            <div class="row">
                <div>
                    <label for="exSets">Sets</label>
                    <input type="number" id="exSets" min="0" placeholder="3">
                </div>
                <div>
                    <label for="exReps">Reps</label>
                    <input type="number" id="exReps" min="0" placeholder="10">
                </div>
                <div>
                    <label for="exWeight">Weight (kg)</label>
                    <input type="number" id="exWeight" min="0" step="0.5" placeholder="60">
                </div>
            </div>
            <label for="exDate">Date</label>
            <input type="date" id="exDate">
            <button class="primary" id="addWorkoutBtn">Add Workout</button>
        </div>
        <div class="card">
            <h2>Workout History</h2>
            <ul class="entries" id="workoutList"></ul>
        </div>
    </section>

    <!-- CALORIES PANEL -->
    <section class="panel" id="calories">
        <div class="card">
            <h2>Log Calories</h2>
            <label for="foodName">Food / Meal</label>
            <input type="text" id="foodName" placeholder="e.g., Chicken & Rice">
            <div class="row">
                <div>
                    <label for="foodKcal">Calories (kcal)</label>
                    <input type="number" id="foodKcal" min="0" placeholder="500">
                </div>
                <div>
                    <label for="foodDate">Date</label>
                    <input type="date" id="foodDate">
                </div>
            </div>
            <button class="primary" id="addCalorieBtn">Add Entry</button>
        </div>
        <div class="card">
            <h2>Calorie History</h2>
            <ul class="entries" id="calorieList"></ul>
        </div>
    </section>

    <!-- PROGRESS PANEL -->
    <section class="panel" id="progress">
        <div class="card">
            <h2>Summary</h2>
            <div class="stats">
                <div class="stat"><div class="num" id="statWorkouts">0</div><div class="lbl">Workouts Logged</div></div>
                <div class="stat"><div class="num" id="statKcalToday">0</div><div class="lbl">Calories Today</div></div>
                <div class="stat"><div class="num" id="statDays">0</div><div class="lbl">Active Days</div></div>
            </div>
        </div>
        <div class="card">
            <h2>Calories — Last 7 Days</h2>
            <div class="bar-wrap" id="calorieChart"></div>
        </div>
    </section>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
